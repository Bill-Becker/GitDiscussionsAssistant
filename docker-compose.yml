x-build: &build
  context: .
  args:
    # Set in .env when building on NLR's network; leave empty elsewhere.
    NREL_ROOT_CERT_URL_ROOT: ${NREL_ROOT_CERT_URL_ROOT:-}

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  web:
    build: *build
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build: *build
    command: rq worker reopt --url redis://redis:6379
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  # Optional, local testing only: forwards GitHub webhooks from a smee.io channel to web.
  # Start with: docker compose --profile smee up -d   (requires SMEE_URL in .env)
  smee:
    image: node:20-alpine
    profiles: ["smee"]
    restart: unless-stopped
    environment:
      - SMEE_URL=${SMEE_URL:-}
    command: >-
      sh -c 'test -n "$$SMEE_URL" || { echo "SMEE_URL is not set in .env"; exit 1; };
      exec npx -y smee-client@2.0.4 --url "$$SMEE_URL" --target http://web:8000/webhook'
    depends_on:
      - web

volumes:
  redis-data:
